<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2C3E50"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <!-- Gradient definitions -->
    <linearGradient id="exonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="peptideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clean white background -->
  <rect width="1000" height="700" fill="white"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
    Isoform-Specific SNP-Peptide Overlap Detection at Protein Level
  </text>
  
  <!-- Gene structure section -->
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
    Gene Structure
  </text>
  
  <!-- Gene line -->
  <line x1="200" y1="90" x2="780" y2="90" stroke="#2C3E50" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Exons with clean styling -->
  <rect x="240" y="75" width="80" height="30" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="340" y="75" width="70" height="30" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="430" y="75" width="90" height="30" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="540" y="75" width="70" height="30" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="630" y="75" width="80" height="30" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  
  <!-- Exon labels -->
  <text x="280" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exon 1</text>
  <text x="375" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exon 2</text>
  <text x="475" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exon 3</text>
  <text x="575" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exon 4</text>
  <text x="670" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exon 5</text>
  
  <!-- SNPs at gene level -->
  <circle cx="460" cy="120" r="4" fill="#E74C3C"/>
  <line x1="460" y1="120" x2="460" y2="135" stroke="#E74C3C" stroke-width="2"/>
  <text x="460" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">SNP₁</text>
  
  <circle cx="590" cy="120" r="4" fill="#E74C3C"/>
  <line x1="590" y1="120" x2="590" y2="135" stroke="#E74C3C" stroke-width="2"/>
  <text x="590" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">SNP₂</text>
  
  <!-- Target peptide indicator -->
  <rect x="450" y="160" width="50" height="15" fill="url(#peptideGrad)" stroke="#F57C00" stroke-width="2" rx="2"/>
  <text x="475" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#F57C00">Target Peptide</text>
  
  <!-- Isoform A -->
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
    Isoform A
  </text>
  <text x="180" y="235" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">
    (Exons 1-2-3-4-5)
  </text>
  
  <!-- Protein coordinate ruler for Isoform A -->
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Protein coordinates:</text>
  <line x1="200" y1="265" x2="750" y2="265" stroke="#BDC3C7" stroke-width="1"/>
  
  <!-- Coordinate ticks -->
  <line x1="200" y1="260" x2="200" y2="270" stroke="#7F8C8D" stroke-width="1"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">1</text>
  <line x1="350" y1="260" x2="350" y2="270" stroke="#7F8C8D" stroke-width="1"/>
  <text x="350" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">150</text>
  <line x1="500" y1="260" x2="500" y2="270" stroke="#7F8C8D" stroke-width="1"/>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">300</text>
  <line x1="650" y1="260" x2="650" y2="270" stroke="#7F8C8D" stroke-width="1"/>
  <text x="650" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">450</text>
  <line x1="750" y1="260" x2="750" y2="270" stroke="#7F8C8D" stroke-width="1"/>
  <text x="750" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">550</text>
  
  <!-- Protein structure for Isoform A -->
  <rect x="200" y="290" width="80" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="280" y="290" width="70" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="350" y="290" width="90" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="440" y="290" width="70" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="510" y="290" width="80" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  
  <!-- Peptide in Isoform A -->
  <rect x="370" y="295" width="50" height="25" fill="url(#peptideGrad)" stroke="#F57C00" stroke-width="2" rx="2"/>
  <text x="395" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8D4E00">Peptide</text>
  <text x="395" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F57C00">AA 180-196</text>
  
  <!-- SNP positions in Isoform A -->
  <circle cx="385" cy="355" r="4" fill="#E74C3C"/>
  <line x1="385" y1="330" x2="385" y2="351" stroke="#E74C3C" stroke-width="2"/>
  <text x="385" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E74C3C">SNP₁: AA 185</text>
  
  <circle cx="525" cy="355" r="4" fill="#E74C3C"/>
  <line x1="525" y1="330" x2="525" y2="351" stroke="#E74C3C" stroke-width="2"/>
  <text x="525" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E74C3C">SNP₂: AA 320</text>
  
  <!-- Overlap indication -->
  <rect x="365" y="380" width="60" height="10" fill="rgba(231,76,60,0.3)" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
  <text x="395" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">OVERLAP</text>
  
  <!-- Isoform B -->
  <text x="80" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
    Isoform B
  </text>
  <text x="180" y="465" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">
    (Exons 1-3-4-5)
  </text>
  <text x="300" y="465" font-family="Arial, sans-serif" font-size="11" fill="#E67E22" font-style="italic">
    Exon 2 skipped
  </text>
  
  <!-- Protein coordinate ruler for Isoform B -->
  <text x="200" y="485" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Protein coordinates:</text>
  <line x1="200" y1="495" x2="650" y2="495" stroke="#BDC3C7" stroke-width="1"/>
  
  <!-- Coordinate ticks for Isoform B -->
  <line x1="200" y1="490" x2="200" y2="500" stroke="#7F8C8D" stroke-width="1"/>
  <text x="200" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">1</text>
  <line x1="350" y1="490" x2="350" y2="500" stroke="#7F8C8D" stroke-width="1"/>
  <text x="350" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">150</text>
  <line x1="500" y1="490" x2="500" y2="500" stroke="#7F8C8D" stroke-width="1"/>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">300</text>
  <line x1="650" y1="490" x2="650" y2="500" stroke="#7F8C8D" stroke-width="1"/>
  <text x="650" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">450</text>
  
  <!-- Protein structure for Isoform B -->
  <rect x="200" y="520" width="80" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="280" y="520" width="90" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="370" y="520" width="70" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  <rect x="440" y="520" width="80" height="35" fill="url(#exonGrad)" stroke="#2E7D32" stroke-width="2" rx="3" filter="url(#shadow)"/>
  
  <!-- Peptide in Isoform B (shifted position) -->
  <rect x="300" y="525" width="50" height="25" fill="url(#peptideGrad)" stroke="#F57C00" stroke-width="2" rx="2"/>
  <text x="325" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8D4E00">Peptide</text>
  <text x="325" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F57C00">AA 110-126</text>
  
  <!-- SNP positions in Isoform B -->
  <circle cx="315" cy="585" r="4" fill="#E74C3C"/>
  <line x1="315" y1="560" x2="315" y2="581" stroke="#E74C3C" stroke-width="2"/>
  <text x="315" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E74C3C">SNP₁: AA 115</text>
  
  <circle cx="455" cy="585" r="4" fill="#E74C3C"/>
  <line x1="455" y1="560" x2="455" y2="581" stroke="#E74C3C" stroke-width="2"/>
  <text x="455" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E74C3C">SNP₂: AA 250</text>
  
  <!-- Overlap indication -->
  <rect x="295" y="610" width="60" height="10" fill="rgba(231,76,60,0.3)" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
  <text x="325" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">OVERLAP</text>
  
  <!-- No overlap for SNP2 in Isoform B -->
  <line x1="430" y1="610" x2="480" y2="610" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="455" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#95A5A6">NO OVERLAP</text>
  
  <!-- Method box -->
  <rect x="780" y="200" width="200" height="300" fill="#F8F9FA" stroke="#BDC3C7" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="880" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">
    Method Workflow
  </text>
  
  <circle cx="795" cy="245" r="3" fill="#3498DB"/>
  <text x="805" y="250" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    Input: Protein-level coordinates
  </text>
  
  <circle cx="795" cy="265" r="3" fill="#3498DB"/>
  <text x="805" y="270" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    • SNP positions per isoform
  </text>
  
  <circle cx="795" cy="285" r="3" fill="#3498DB"/>
  <text x="805" y="290" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    • Peptide coordinates per isoform
  </text>
  
  <line x1="790" y1="305" x2="970" y2="305" stroke="#BDC3C7" stroke-width="1"/>
  
  <circle cx="795" cy="325" r="3" fill="#E67E22"/>
  <text x="805" y="330" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    For each isoform:
  </text>
  
  <circle cx="795" cy="345" r="3" fill="#E67E22"/>
  <text x="805" y="350" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    Check if SNP position ∈
  </text>
  
  <circle cx="795" cy="365" r="3" fill="#E67E22"/>
  <text x="805" y="370" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    [peptide_start, peptide_end]
  </text>
  
  <line x1="790" y1="385" x2="970" y2="385" stroke="#BDC3C7" stroke-width="1"/>
  
  <circle cx="795" cy="405" r="3" fill="#27AE60"/>
  <text x="805" y="410" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    Output: Isoform-specific
  </text>
  
  <circle cx="795" cy="425" r="3" fill="#27AE60"/>
  <text x="805" y="430" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    overlap results
  </text>
  
  <circle cx="795" cy="445" r="3" fill="#27AE60"/>
  <text x="805" y="450" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    • SNP₁ overlaps in A & B
  </text>
  
  <circle cx="795" cy="465" r="3" fill="#27AE60"/>
  <text x="805" y="470" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">
    • SNP₂ overlaps only in A
  </text>
  
  <!-- Key insight box -->
  <rect x="80" y="650" width="850" height="40" fill="#E8F4FD" stroke="#3498DB" stroke-width="2" rx="5"/>
  <text x="90" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">
    Key Insight:
  </text>
  <text x="170" y="670" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Same genomic SNPs map to different protein coordinates across isoforms, enabling differential peptide overlap patterns
  </text>
</svg>